<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adeptus Analytica - Battle Log</title>
<style>
  :root {
    --bg: #101013;
    --panel: #17171b;
    --panel-2: #1e1e23;
    --border: #313138;
    --gold: #b08d45;
    --gold-dim: #7d6531;
    --red: #8c2a2a;
    --text: #e6e1d3;
    --text-dim: #9a978c;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
    padding: 20px;
  }
  h1 {
    letter-spacing: 2px;
    color: var(--gold);
    font-size: 20px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 18px;
  }
  h1 span { color: var(--text-dim); font-size: 12px; letter-spacing: 1px; display: block; margin-top: 4px; text-transform: none; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold);
    margin: 0 0 12px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  label {
    display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  select, input, button {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: 3px; font-family: Georgia, serif; font-size: 14px;
  }
  select:focus, input:focus { outline: 1px solid var(--gold-dim); border-color: var(--gold-dim); }
  .result-btn-group { display: flex; gap: 8px; margin-top: 4px; }
  .result-btn { width: auto; flex: 1; cursor: pointer; padding: 9px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  .result-btn.win.active { border-color: #4f7a3f; color: #9fcf8a; box-shadow: inset 0 0 0 1px #4f7a3f; }
  .result-btn.loss.active { border-color: var(--red); color: #e08a8a; box-shadow: inset 0 0 0 1px var(--red); }
  .result-btn.draw.active { border-color: var(--gold-dim); color: #d9c58a; box-shadow: inset 0 0 0 1px var(--gold-dim); }
  button.submit {
    margin-top: 18px; background: var(--red); border: 1px solid #a83c3c; color: #f0e6d8;
    font-weight: bold; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; cursor: pointer; padding: 11px;
  }
  button.submit:hover { background: #a83232; }
  button.submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .error { color: #e08a8a; font-size: 12px; margin-top: 8px; display: none; }
  .conn-note { color: var(--text-dim); font-size: 11px; margin-top: 14px; line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px; }
  .conn-note.bad { color: #e08a8a; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; }
  .stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 20px; color: var(--gold); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border); padding: 6px 8px; white-space: nowrap;
  }
  td { padding: 7px 8px; border-bottom: 1px solid #232328; }
  .table-scroll { overflow-x: auto; }
  .bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-bg { flex: 1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--gold-dim); }
  .badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge.win { background: rgba(79,122,63,0.25); color: #9fcf8a; }
  .badge.loss { background: rgba(140,42,42,0.25); color: #e08a8a; }
  .badge.draw { background: rgba(125,101,49,0.25); color: #d9c58a; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }
  .del-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; width: auto; padding: 0 4px; }
  .del-btn:hover { color: #e08a8a; }
  .list-panel { max-height: 320px; overflow-y: auto; margin-top: 4px; }
  .loading { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<h1>Campaign Log<span>Adeptus Analytica — log your games and track your win rate</span></h1>

<div class="layout">

  <div class="panel">
    <h2>New game</h2>

    <label for="puntos">Points</label>
    <input id="puntos" type="number" min="0" step="50" placeholder="e.g. 2000">

    <label for="ejercito">Your army</label>
    <select id="ejercito">
      <option>Adeptus Astartes</option>
      <option>Astra Militarum</option>
      <option>Orks</option>
      <option>Necrons</option>
      <option>Tyranids</option>
      <option>Chaos Marines</option>
      <option>Aeldari</option>
      <option>T'au Empire</option>
      <option>Thousand Sons</option>
      <option>Drukhari</option>
      <option>Chaos Knights</option>
      <option value="__custom">Other (type in)...</option>
    </select>
    <input id="ejercito-custom" placeholder="Army name" style="display:none; margin-top:8px;">

    <label for="rival">Opponent's army</label>
    <select id="rival">
      <option>Adeptus Astartes</option>
      <option>Astra Militarum</option>
      <option>Orks</option>
      <option>Necrons</option>
      <option>Tyranids</option>
      <option>Chaos Marines</option>
      <option>Aeldari</option>
      <option>T'au Empire</option>
      <option>Thousand Sons</option>
      <option>Drukhari</option>
      <option>Chaos Knights</option>
      <option value="__custom">Other (type in)...</option>
    </select>
    <input id="rival-custom" placeholder="Opponent army name" style="display:none; margin-top:8px;">

    <label>Result</label>
    <div class="result-btn-group">
      <button type="button" class="result-btn win" data-result="Win">Win</button>
      <button type="button" class="result-btn draw" data-result="Draw">Draw</button>
      <button type="button" class="result-btn loss" data-result="Loss">Loss</button>
    </div>

    <div class="error" id="form-error"></div>
    <button class="submit" id="btn-log">Log game</button>

    <div class="conn-note" id="conn-note">Connecting to database…</div>
  </div>

  <div class="panel">
    <h2>Record</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Games</div><div class="value" id="s-total">0</div></div>
      <div class="stat-card"><div class="label">Win rate</div><div class="value" id="s-winrate">0%</div></div>
      <div class="stat-card"><div class="label">W / L / D</div><div class="value" id="s-vde">0/0/0</div></div>
    </div>

    <h2>Win rate by army</h2>
    <div class="table-scroll">
      <table id="tabla-resumen">
        <thead><tr><th>Army</th><th>Games</th><th>Win rate</th></tr></thead>
        <tbody id="tbody-resumen"></tbody>
      </table>
      <div class="empty" id="empty-resumen" style="display:none;">No games logged yet.</div>
    </div>

    <h2 style="margin-top:18px;">Game history</h2>
    <div class="table-scroll list-panel">
      <table>
        <thead><tr><th>Date</th><th>Pts</th><th>Your army</th><th>Opponent</th><th>Result</th><th></th></tr></thead>
        <tbody id="tbody-historial"></tbody>
      </table>
      <div class="empty" id="empty-historial" style="display:none;">No games logged yet.</div>
      <div class="loading" id="loading-note">Loading your games…</div>
    </div>
  </div>

</div>

<script>
// ====== FILL THESE IN FROM SUPABASE PROJECT SETTINGS -> API ======
const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
// ===================================================================

const TABLE_URL = `${SUPABASE_URL}/rest/v1/games`;
const HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json',
};

const $ = id => document.getElementById(id);
let partidas = [];
let resultadoSeleccionado = null;

$('ejercito').addEventListener('change', () => {
  $('ejercito-custom').style.display = $('ejercito').value === '__custom' ? 'block' : 'none';
});
$('rival').addEventListener('change', () => {
  $('rival-custom').style.display = $('rival').value === '__custom' ? 'block' : 'none';
});

document.querySelectorAll('.result-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    resultadoSeleccionado = btn.dataset.result;
    document.querySelectorAll('.result-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function mostrarError(msg) {
  const el = $('form-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function limpiarError() {
  $('form-error').style.display = 'none';
}
function setConnNote(msg, bad) {
  const el = $('conn-note');
  el.textContent = msg;
  el.classList.toggle('bad', !!bad);
}

function configurado() {
  return !SUPABASE_URL.includes('YOUR-PROJECT-REF') && !SUPABASE_ANON_KEY.includes('YOUR-ANON-PUBLIC-KEY');
}

async function cargarPartidas() {
  if (!configurado()) {
    setConnNote('Not connected yet — open this file in a text editor and paste your Supabase URL and anon key at the top of the script.', true);
    $('loading-note').textContent = 'Database not configured yet.';
    return;
  }
  try {
    const res = await fetch(`${TABLE_URL}?select=*&order=created_at.asc`, { headers: HEADERS });
    if (!res.ok) throw new Error(await res.text());
    partidas = await res.json();
    setConnNote('Connected — this page reads and writes straight to your Supabase database, so it stays in sync across every device.');
    $('loading-note').style.display = 'none';
    render();
  } catch (e) {
    setConnNote('Could not connect to the database. Check your Supabase URL, anon key, and that the games table exists.', true);
    $('loading-note').textContent = 'Could not load games.';
  }
}

$('btn-log').addEventListener('click', async () => {
  limpiarError();
  if (!configurado()) return mostrarError('Database is not configured yet — see the note below.');

  let ejercito = $('ejercito').value;
  if (ejercito === '__custom') ejercito = $('ejercito-custom').value.trim();
  let rival = $('rival').value;
  if (rival === '__custom') rival = $('rival-custom').value.trim();
  const puntos = $('puntos').value ? Number($('puntos').value) : null;

  if (!ejercito) return mostrarError('Enter your army.');
  if (!rival) return mostrarError('Enter your opponent\'s army.');
  if (!resultadoSeleccionado) return mostrarError('Pick a result: Win, Draw, or Loss.');

  const nuevaPartida = { points: puntos, army: ejercito, opponent: rival, result: resultadoSeleccionado };

  try {
    const res = await fetch(TABLE_URL, {
      method: 'POST',
      headers: { ...HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify(nuevaPartida),
    });
    if (!res.ok) throw new Error(await res.text());
    const [inserted] = await res.json();
    partidas.push(inserted);

    $('puntos').value = '';
    resultadoSeleccionado = null;
    document.querySelectorAll('.result-btn').forEach(b => b.classList.remove('active'));

    render();
  } catch (e) {
    mostrarError('Could not save the game. Check your connection and try again.');
  }
});

async function eliminarPartida(id) {
  try {
    const res = await fetch(`${TABLE_URL}?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    if (!res.ok) throw new Error(await res.text());
    partidas = partidas.filter(p => p.id !== id);
    render();
  } catch (e) {
    mostrarError('Could not delete that game. Try again.');
  }
}

function render() {
  const total = partidas.length;
  const victorias = partidas.filter(p => p.result === 'Win').length;
  const derrotas = partidas.filter(p => p.result === 'Loss').length;
  const empates = partidas.filter(p => p.result === 'Draw').length;
  const winrate = total > 0 ? Math.round((victorias / total) * 1000) / 10 : 0;

  $('s-total').textContent = total;
  $('s-winrate').textContent = winrate + '%';
  $('s-vde').textContent = `${victorias}/${derrotas}/${empates}`;

  const porEjercito = {};
  partidas.forEach(p => {
    if (!porEjercito[p.army]) porEjercito[p.army] = { jugadas: 0, victorias: 0 };
    porEjercito[p.army].jugadas += 1;
    if (p.result === 'Win') porEjercito[p.army].victorias += 1;
  });

  const tbodyResumen = $('tbody-resumen');
  tbodyResumen.innerHTML = '';
  const ejercitos = Object.keys(porEjercito).sort(
    (a, b) => (porEjercito[b].victorias / porEjercito[b].jugadas) - (porEjercito[a].victorias / porEjercito[a].jugadas)
  );

  $('empty-resumen').style.display = ejercitos.length === 0 ? 'block' : 'none';
  $('tabla-resumen').style.display = ejercitos.length === 0 ? 'none' : 'table';

  ejercitos.forEach(ej => {
    const d = porEjercito[ej];
    const wr = Math.round((d.victorias / d.jugadas) * 1000) / 10;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${ej}</td>
      <td>${d.jugadas}</td>
      <td>
        <div class="bar-wrap">
          <div class="bar-bg"><div class="bar-fill" style="width:${wr}%"></div></div>
          <span style="min-width:38px;">${wr}%</span>
        </div>
      </td>`;
    tbodyResumen.appendChild(tr);
  });

  const tbodyHist = $('tbody-historial');
  tbodyHist.innerHTML = '';
  $('empty-historial').style.display = total === 0 ? 'block' : 'none';

  [...partidas].reverse().forEach(p => {
    const cls = p.result === 'Win' ? 'win' : (p.result === 'Loss' ? 'loss' : 'draw');
    const fecha = (p.created_at || '').slice(0, 10);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${fecha}</td>
      <td>${p.points ?? '-'}</td>
      <td>${p.army}</td>
      <td>${p.opponent}</td>
      <td><span class="badge ${cls}">${p.result}</span></td>
      <td><button class="del-btn" data-id="${p.id}" aria-label="Delete game">&times;</button></td>`;
    tbodyHist.appendChild(tr);
  });

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => eliminarPartida(Number(btn.dataset.id)));
  });
}

cargarPartidas();
</script>

</body>
</html>
